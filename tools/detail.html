<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الأداة - AI Tools Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center max-w-4xl mx-auto w-full">
        <a href="../index.html" class="text-blue-400 hover:underline text-sm">← العودة للرئيسية</a>
        <h1 class="text-lg font-bold text-blue-500">AI Tools Hub</h1>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto p-6 w-full flex-grow">
        <div id="tool-details" class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl">
            <div class="text-center py-10 text-gray-400">جاري تحميل تفاصيل الأداة...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 border-t border-gray-800 text-xs text-gray-500">
        جميع الحقوق محفوظة &copy; 2026 AI Tools Hub
    </footer>

    <!-- Script to Load Tool Data -->
    <script src="../assets/js/data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const toolId = urlParams.get('id');
        const container = document.getElementById('tool-details');

        if (typeof toolsData !== 'undefined' && toolId) {
            const tool = toolsData.find(t => t.id == toolId || t.name.toLowerCase().includes(toolId.toLowerCase()));
            if (tool) {
                container.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-xs bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-800">${tool.category}</span>
                            <h2 class="text-2xl font-bold mt-2 text-white">${tool.name}</h2>
                        </div>
                        <div class="flex items-center bg-yellow-500/10 border border-yellow-500/20 px-3 py-1 rounded-lg text-yellow-400 text-sm font-semibold">
                            ⭐ ${tool.rating}
                        </div>
                    </div>
                    <p class="text-gray-300 text-base leading-relaxed mb-6">${tool.description}</p>
                    <div class="mb-6">
                        <h3 class="text-sm font-semibold text-gray-400 mb-3">المميزات الرئيسية:</h3>
                        <div class="flex flex-wrap gap-2">
                            ${tool.features ? tool.features.map(f => `<span class="bg-gray-800 text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-gray-700">${f}</span>`).join('') : ''}
                        </div>
                    </div>
                    <a href="${tool.url}" target="_blank" class="block text-center w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20">
                        زيارة الأداة الرسمية ↗
                    </a>
                `;
            } else {
                container.innerHTML = `<div class="text-center py-10 text-red-400">عذراً، لم يتم العثور على بيانات هذه الأداة.</div>`;
            }
        } else {
            container.innerHTML = `<div class="text-center py-10 text-red-400">خطأ في تحديد الأداة المطلوبة.</div>`;
        }
    </script>
</body>
</html>
