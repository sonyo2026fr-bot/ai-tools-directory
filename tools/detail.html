<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الأداة - AI Tools Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-['Cairo']">

    <!-- Header / Navbar -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2 text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
                <i class="fa-solid fa-brain text-blue-500"></i>
                <span>AI Tools Hub</span>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm text-slate-300">
                <a href="../index.html" class="hover:text-blue-400 transition">الرئيسية</a>
                <a href="../about.html" class="hover:text-blue-400 transition">عن الموقع</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="mb-6">
            <a href="../index.html" class="inline-flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300 transition">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة إلى الرئيسية</span>
            </a>
        </div>

        <div id="toolDetails" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl">
            <!-- Dynamic Tool Details Loaded via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-8 mt-16 text-center text-sm text-slate-400">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>جميع الحقوق محفوظة &copy; 2026 - AI Tools Hub</p>
            <div class="flex gap-6">
                <a href="../about.html" class="hover:text-blue-400 transition">عن الموقع</a>
                <a href="../privacy.html" class="hover:text-blue-400 transition">سياسة الخصوصية</a>
                <a href="../terms.html" class="hover:text-blue-400 transition">شروط الاستخدام</a>
            </div>
        </div>
    </footer>

    <!-- JS Logic -->
    <script src="../assets/js/data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const toolId = parseInt(urlParams.get('id'));
        const container = document.getElementById('toolDetails');

        const tool = aiToolsData.find(t => t.id === toolId);

        if (!tool) {
            container.innerHTML = `
                <div class="text-center py-12">
                    <i class="fa-solid fa-triangle-exclamation text-5xl text-yellow-500 mb-4"></i>
                    <h2 class="text-2xl font-bold mb-2">الأداة غير موجودة</h2>
                    <p class="text-slate-400 mb-6">عذراً، لم نتمكن من العثور على الأداة المطلوبة.</p>
                    <a href="../index.html" class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition">العودة للرئيسية</a>
                </div>
            `;
        } else {
            document.title = `${tool.name} - تفاصيل الأداة`;
            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-6 border-b border-slate-800">
                    <div>
                        <span class="bg-blue-500/10 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full border border-blue-500/20 inline-block mb-3">${tool.category}</span>
                        <h1 class="text-3xl sm:text-4xl font-black text-slate-100">${tool.name}</h1>
                    </div>
                    <div class="flex items-center gap-2 bg-slate-950 px-4 py-2 rounded-2xl border border-slate-800 self-start sm:self-auto">
                        <i class="fa-solid fa-star text-yellow-400 text-lg"></i>
                        <span class="text-xl font-bold text-slate-100">${tool.rating}</span>
                        <span class="text-xs text-slate-500">/ 5.0</span>
                    </div>
                </div>

                <p class="text-slate-300 text-lg leading-relaxed mb-8">${tool.description}</p>

                <div class="mb-8">
                    <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-blue-500"></i>
                        <span>أبرز المميزات والخصائص:</span>
                    </h3>
                    <ul class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${tool.features.map(f => `
                            <li class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 flex items-center gap-3 text-sm text-slate-300">
                                <i class="fa-solid fa-check text-blue-400"></i>
                                <span>${f}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <div class="flex flex-col sm:flex-row items-center gap-4 pt-6 border-t border-slate-800">
                    <a href="${tool.url}" target="_blank" class="w-full sm:w-auto flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-2xl transition text-center flex items-center justify-center gap-3 shadow-lg shadow-blue-600/20">
                        <span>زيارة الموقع الرسمي للأداة</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                    </a>
                    <a href="../index.html" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-4 px-6 rounded-2xl transition text-center">
                        العودة للقائمة
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
